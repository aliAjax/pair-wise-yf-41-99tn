<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地震台网事件编目与修订</title>
  <style>
    :root { --line: #e5e7eb; --muted: #6b7280; --bg: #f9fafb; --accent: #1d4ed8; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
           margin: 0; color: #1f2937; background: var(--bg); }
    main { max-width: 960px; margin: auto; padding: 1.5rem 1.25rem 3rem; }
    h1 { font-size: 1.35rem; margin: .25rem 0 .25rem; }
    h2 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
    .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    button { padding: .4rem .8rem; border: 1px solid #d1d5db; background: #fff;
             border-radius: 6px; cursor: pointer; font-size: .85rem; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    input, select { padding: .4rem .5rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: .85rem; }
    label { font-size: .8rem; color: var(--muted); }
    ul.events { list-style: none; padding: 0; margin: .75rem 0 0; }
    .event { background: #fff; border: 1px solid var(--line); border-radius: 8px;
             padding: .75rem 1rem; margin-bottom: .6rem; cursor: pointer; }
    .event:hover { border-color: var(--accent); }
    .event .row { display: flex; justify-content: space-between; gap: .75rem; align-items: baseline; }
    .event .title { font-weight: 600; }
    .event .meta { color: var(--muted); font-size: .78rem; margin-top: .2rem; }
    .badge { font-size: .72rem; padding: .1rem .5rem; border-radius: 999px; white-space: nowrap; }
    .b-published { background: #dcfce7; color: #166534; }
    .b-pending_review, .b-withdrawn { background: #fee2e2; color: #991b1b; }
    .b-reviewed { background: #dbeafe; color: #1e40af; }
    .b-associated { background: #fef9c3; color: #854d0e; }
    .b-candidate, .b-revised { background: #f3f4f6; color: #374151; }
    table { width: 100%; border-collapse: collapse; background: #fff;
            border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: .82rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line);
             vertical-align: top; }
    th { background: #f3f4f6; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    pre { background: #1f2937; color: #e5e7eb; padding: .8rem; border-radius: 8px;
          overflow-x: auto; font-size: .76rem; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-top: .75rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .5rem; }
    .grid input { width: 100%; }
    #status { font-size: .8rem; color: var(--muted); min-height: 1.1rem; }
    .empty { color: var(--muted); font-size: .85rem; padding: 1rem 0; }
  </style>
</head>
<body>
<main>
  <h1>地震台网事件编目与修订</h1>
  <div class="sub">值班台站修正报文按台站编号归并：补波形保留审校结论；震中、发震时刻或震级变化则撤回发布稿并生成待复核修订。</div>

  <div class="toolbar">
    <button class="primary" onclick="loadEvents()">刷新事件</button>
    <label>台站 <input id="stationFilter" placeholder="如 STA-1"></label>
    <button onclick="loadEventsByStation()">按台站过滤</button>
    <button onclick="document.getElementById('stationFilter').value=''; loadEvents();">清除</button>
    <label class="toolbar"><input type="checkbox" id="onlyPending"> 仅看待复核</label>
  </div>
  <ul class="events" id="eventList"></ul>

  <div id="detail" style="display:none;">
    <h2>修订链 <span id="detailTitle" class="sub"></span></h2>
    <table>
      <thead><tr><th>版本</th><th>状态</th><th>说明</th><th>震级</th><th>震中</th><th>时间</th></tr></thead>
      <tbody id="revisionRows"></tbody>
    </table>

    <h2>提交台站修正报文</h2>
    <div class="panel">
      <div class="grid">
        <label>台站编号<input id="cStation" placeholder="STA-2"></label>
        <label>波形标识<input id="cWaveform" placeholder="wf://...（补波形）"></label>
        <label>震级<input id="cMagnitude" type="number" step="0.1" placeholder="如 5.1"></label>
        <label>震中<input id="cLocation" placeholder="新震中"></label>
        <label>发震时刻<input id="cOrigin" placeholder="ISO 时间"></label>
        <label>原因<input id="cReason" placeholder="变化原因"></label>
      </div>
      <p class="sub" style="margin:.6rem 0 .4rem;">身份：
        <select id="cRole"><option value="station">station（台站）</option><option value="admin">admin</option></select>
        <input id="cUser" placeholder="台站操作员" value="sta1" style="width:9rem;">
      </p>
      <button class="primary" onclick="submitCorrection()">提交修正</button>
      <span id="status"></span>
    </div>

    <h2>审计时间线</h2>
    <table>
      <thead><tr><th>动作</th><th>状态变化</th><th>操作者</th><th>详情</th></tr></thead>
      <tbody id="auditRows"></tbody>
    </table>
  </div>
</main>
<script>
let currentEventId = null;

function badge(status) {
  const labels = {
    candidate: '候选', associated: '已关联', reviewed: '已初审',
    published: '已发布', revised: '已修订', withdrawn: '已撤回',
    pending_review: '待复核',
  };
  return `<span class="badge b-${status}">${labels[status] || status}</span>`;
}

async function getJSON(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || ('HTTP ' + response.status));
  return body;
}

async function loadEvents() {
  const onlyPending = document.getElementById('onlyPending').checked;
  const query = onlyPending ? '?status=pending_review' : '';
  const items = (await getJSON('/api/events' + query)).items;
  renderEvents(items);
}

async function loadEventsByStation() {
  const station = document.getElementById('stationFilter').value.trim();
  if (!station) return loadEvents();
  const items = (await getJSON('/api/events?station=' + encodeURIComponent(station))).items;
  renderEvents(items);
}

function renderEvents(items) {
  const list = document.getElementById('eventList');
  if (!items.length) {
    list.innerHTML = '<div class="empty">没有事件</div>';
    return;
  }
  list.innerHTML = items.map(event => `
    <li class="event" onclick="showEvent('${event.id}')">
      <div class="row">
        <span class="title">${event.data.title || event.id}</span>
        ${badge(event.status)}
      </div>
      <div class="meta">v${event.version} · ${event.data.location || '-'} ·
        ${event.data.origin_time || '-'} ·
        台站 ${(event.data.reports || []).map(r => r.station).join('、')}</div>
    </li>`).join('');
}

async function showEvent(eventId) {
  currentEventId = eventId;
  document.getElementById('detail').style.display = 'block';
  const event = await getJSON('/api/entities/' + eventId);
  document.getElementById('detailTitle').textContent =
    (event.data.title || eventId) + ' · v' + event.version;
  const revisions = (await getJSON('/api/entities/' + eventId + '/revisions')).items;
  document.getElementById('revisionRows').innerHTML = revisions.map(r => `
    <tr>
      <td>v${r.version}</td>
      <td>${badge(r.status)}</td>
      <td>${r.note || ''}</td>
      <td>${r.data.magnitude ?? '-'}</td>
      <td>${r.data.location || '-'}</td>
      <td>${r.data.origin_time || '-'}</td>
    </tr>`).join('');
  const audit = (await getJSON('/api/audit?entity_id=' + eventId)).items;
  document.getElementById('auditRows').innerHTML = audit.map(a => `
    <tr>
      <td>${a.action}</td>
      <td>${a.from_status || '—'} → ${a.to_status}</td>
      <td>${a.actor_id}（${a.actor_role}）</td>
      <td><code>${JSON.stringify(a.detail)}</code></td>
    </tr>`).join('');
  document.getElementById('status').textContent = '';
}

async function submitCorrection() {
  const statusEl = document.getElementById('status');
  if (!currentEventId) {
    statusEl.textContent = '请先选择一个事件';
    return;
  }
  const body = { station: document.getElementById('cStation').value.trim() };
  const waveform = document.getElementById('cWaveform').value.trim();
  const magnitude = document.getElementById('cMagnitude').value;
  const location = document.getElementById('cLocation').value.trim();
  const origin = document.getElementById('cOrigin').value.trim();
  const reason = document.getElementById('cReason').value.trim();
  if (waveform) body.waveform = waveform;
  if (magnitude) body.magnitude = Number(magnitude);
  if (location) body.location = location;
  if (origin) body.origin_time = origin;
  if (reason) body.reason = reason;
  statusEl.textContent = '提交中…';
  try {
    const updated = await getJSON('/api/entities/' + currentEventId + '/corrections', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-User-Id': document.getElementById('cUser').value || 'station',
        'X-Role': document.getElementById('cRole').value,
      },
      body: JSON.stringify(body),
    });
    statusEl.textContent = '已落地 v' + updated.version + '，状态：' + updated.status;
    await loadEvents();
    await showEvent(currentEventId);
  } catch (error) {
    statusEl.textContent = '失败：' + error.message;
  }
}

loadEvents().catch(error => {
  document.getElementById('eventList').innerHTML =
    '<div class="empty">加载失败：' + error.message + '</div>';
});
</script>
</body>
</html>
